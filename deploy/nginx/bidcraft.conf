# /etc/nginx/sites-available/bidcraft
# Serves the Angular build and proxies /api to the .NET API. Put your TLS certificate here.
# install.sh fills in __BIDCRAFT_HOST__ and __BIDCRAFT_PORT__ (BIDCRAFT_HOST, BIDCRAFT_HTTPS_PORT) and drops
# the port-80 redirect when BidCraft has its own port on a server shared with other sites.
# --- http-redirect
server {
    listen 80;
    server_name __BIDCRAFT_HOST__;
    return 301 https://$host$request_uri;
}
# --- end http-redirect

server {
    listen __BIDCRAFT_PORT__ ssl http2;
    server_name __BIDCRAFT_HOST__;

    ssl_certificate     /etc/bidcraft/tls/fullchain.pem;
    ssl_certificate_key /etc/bidcraft/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 300m;
    root /opt/bidcraft/web;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 7d;
    }

    # pdf.js loads its worker as a JavaScript module (.mjs); nginx's mime.types does not know .mjs, and with
    # nosniff the browser refuses an octet-stream worker, leaving every preview page blank
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location / {
        # revalidate the app on every load so an update reaches open browsers (add_header here replaces the
        # server-level headers, hence repeated)
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ /index.html;
    }
}
